<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050912">
  <meta name="description" content="Electronic Center - soluciones tecnológicas, reparación de celulares y servicio técnico. Contacta a Frank Zevallos Ocampo.">
  <title>Electronic Center | Tap5 NFC</title>
  <style>
    :root{--blue:#075bff;--cyan:#00b9ff;--bg:#050912;--panel:#0b1424;--text:#f7fbff;--muted:#b9c7d8;--green:#08b65b}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;width:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
    body{overflow-x:hidden}
    .page{width:100%;min-height:100vh;background:linear-gradient(180deg,#f8fbff 0,#eaf4ff 29%,#07101d 42%,#03070e 100%)}
    .hero{width:100%;height:clamp(250px,54vw,470px);overflow:hidden;background:#fff}
    .hero img{display:block;width:100%;height:100%;object-fit:cover;object-position:center top}
    .content{width:100%;padding:28px 20px max(34px,env(safe-area-inset-bottom));margin:0 auto;background:radial-gradient(ellipse at 50% 0%,#102b4c 0,#07111f 44%,#03070e 100%);text-align:center}
    .brand{font-weight:900;font-size:clamp(12px,3.5vw,17px);letter-spacing:.28em;color:#eaf7ff;margin:0 0 8px}
    .brand span{color:var(--cyan)}
    .rule{width:100px;height:3px;border-radius:4px;background:linear-gradient(90deg,var(--cyan),var(--blue));margin:0 auto 20px}
    h1{font-size:clamp(22px,6vw,30px);line-height:1.15;margin:0 0 8px;font-weight:700}
    .role{margin:0 0 25px;color:#c5d8ed;font-size:12px;letter-spacing:.25em;text-transform:uppercase}
    .actions{display:grid;gap:13px;width:100%;max-width:520px;margin:0 auto}
    .btn{min-height:64px;display:flex;align-items:center;justify-content:center;gap:13px;padding:14px 17px;border-radius:17px;text-decoration:none;font-weight:800;letter-spacing:.035em;font-size:14px;color:#fff;border:1px solid rgba(90,173,255,.65);background:linear-gradient(135deg,#0649c9,#07338d);box-shadow:0 8px 22px #001a42a8;transition:transform .15s ease,filter .15s ease}
    .btn:active{transform:scale(.985);filter:brightness(1.12)}
    .btn svg{width:27px;height:27px;flex:0 0 27px}
    .btn.whatsapp{background:linear-gradient(135deg,#08b85b,#078b45);border-color:#21e078;box-shadow:0 8px 22px #003d21a8}
    .btn.contact{background:linear-gradient(135deg,#075bff,#063b9c)}
    .btn.call{background:linear-gradient(135deg,#079b50,#04713b);border-color:#20ce78}
    .btn.email{background:#fff;color:#101827;border-color:#dce5ef;box-shadow:0 8px 22px #0005}
    .btn.maps{background:linear-gradient(135deg,#075bff,#063b9c)}
    .btn .label{flex:1;text-align:center}
    .chevron{font-size:25px;font-weight:400;opacity:.85;line-height:1}
    .footer{font-size:10px;color:#6f8aa7;letter-spacing:.12em;margin:24px 0 0}
    @media(min-width:700px){.content{padding-top:32px}.actions{grid-template-columns:1fr 1fr}.btn.contact,.btn.whatsapp,.btn.maps{grid-column:1/-1}.hero{height:min(45vw,520px)}}
  </style>
</head>
<body>
  <main class="page">
    <section class="hero" aria-label="Electronic Center - servicios tecnológicos">
      <img src="electronic-center-banner.png" alt="Electronic Center: reparación de celulares, accesorios, servicio técnico, equipos y repuestos">

    <section class="content">

      </nav>
      <p class="footer">ELECTRONIC CENTER · TAP5 NFC</p>
    </section>
  </main>
</body>
</html>
