<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070d">
  <meta name="description" content="Perfil digital de Gabriel Villar, fundador de Tap5. Tu identidad digital, en un toque.">
  <title>Gabriel Villar | Tap5</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070d;
      --blue: #086bff;
      --cyan: #12d9f4;
      --white: #f7fbff;
      --muted: #aab8d0;
      --line: rgba(27, 176, 255, .35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 28px 16px;
      display: flex; align-items: center; justify-content: center;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--white);
      background:
        radial-gradient(ellipse at 50% 0%, rgba(0, 102, 255, .22), transparent 48%),
        radial-gradient(ellipse at 100% 100%, rgba(0, 220, 255, .11), transparent 40%),
        var(--bg);
    }
    .card {
      width: min(100%, 440px); position: relative; overflow: hidden;
      border: 1px solid var(--line); border-radius: 28px;
      padding: 28px 22px 24px; text-align: center;
      background: linear-gradient(155deg, rgba(16, 25, 48, .96), rgba(4, 7, 15, .98) 68%);
      box-shadow: 0 0 42px rgba(0, 100, 255, .16), inset 0 1px rgba(255,255,255,.04);
    }
    .card::before, .card::after {
      content: ""; position: absolute; width: 150px; height: 150px;
      border: 2px solid rgba(0, 177, 255, .5); border-radius: 50%; pointer-events: none;
    }
    .card::before { top: -108px; left: -94px; }
    .card::after { bottom: -112px; right: -102px; }
    .logo-wrap {
      width: 132px; height: 132px; margin: 0 auto 16px; border-radius: 50%;
      overflow: hidden; background: #000; border: 1px solid rgba(0, 196, 255, .5);
      box-shadow: 0 0 25px rgba(0, 102, 255, .22);
    }
    .logo { display: block; width: 100%; height: 100%; object-fit: cover; }
    .eyebrow { margin: 0 0 8px; color: var(--cyan); text-transform: uppercase; letter-spacing: .2em; font-size: 11px; font-weight: 800; }
    h1 { margin: 0; font-size: clamp(28px, 7vw, 36px); letter-spacing: -.04em; line-height: 1.1; }
    .role { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
    .rule { width: 92px; height: 4px; margin: 20px auto; border-radius: 8px; background: linear-gradient(90deg, var(--blue), var(--cyan)); box-shadow: 0 0 14px rgba(0, 180, 255, .45); }
    .tagline { margin: 0 0 18px; font-size: 13px; letter-spacing: .04em; color: #e4edf9; }
    .video-section { margin: 0 0 22px; position: relative; z-index: 1; }
    .video-title { margin: 0 0 10px; text-align: center; font-size: 12px; color: var(--cyan); text-transform: uppercase; letter-spacing: .16em; font-weight: 800; }
    .video-frame {
      width: min(100%, 310px); margin: 0 auto; padding: 3px; border-radius: 20px;
      background: linear-gradient(145deg, var(--blue), var(--cyan));
      box-shadow: 0 0 24px rgba(0, 120, 255, .18);
    }
    video { display: block; width: 100%; max-height: 490px; aspect-ratio: 9 / 16; object-fit: contain; background: #02040a; border-radius: 17px; }
    .video-note { margin: 8px 0 0; text-align: center; color: #8192ad; font-size: 11px; }
    .actions { display: grid; gap: 10px; position: relative; z-index: 1; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 11px;
      min-height: 49px; padding: 12px 16px; border-radius: 13px;
      text-decoration: none; font-size: 14px; font-weight: 750;
      color: var(--white); border: 1px solid rgba(64, 151, 255, .35);
      background: rgba(255,255,255,.035); transition: transform .15s ease, border-color .15s ease;
    }
    .btn:hover, .btn:focus-visible { transform: translateY(-1px); border-color: var(--cyan); outline: none; }
    .btn.primary { color: #04101d; background: linear-gradient(100deg, #1684ff, #19e0ed); border: 0; box-shadow: 0 7px 22px rgba(0, 115, 255, .2); }
    .btn.catalog { border-color: rgba(25,217,238,.7); background: linear-gradient(100deg,rgba(8,107,255,.13),rgba(18,217,244,.08)); }
    .icon { width: 23px; height: 23px; flex: 0 0 23px; display: inline-flex; align-items: center; justify-content: center; }
    .icon svg { width: 23px; height: 23px; display: block; }
    .icon.whatsapp { color: #25D366; }
    .icon.instagram { color: #E4405F; }
    .icon.facebook { color: #1877F2; }
    .icon.email { color: #12d9f4; }
    .icon.catalog { color: #12d9f4; }
    footer { margin-top: 22px; color: #71819d; font-size: 10px; letter-spacing: .22em; font-weight: 800; }
    @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
  </style>
</head>
