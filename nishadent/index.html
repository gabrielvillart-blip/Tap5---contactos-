<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Dra. Denisse Quiñones | Nishadent</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f4f6;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:#111;
}

.card{
  max-width:430px;
  min-height:100vh;
  margin:auto;
  background:#fff;
  padding:38px 22px 28px;
  text-align:center;
}

.logo{
  font-weight:900;
  font-size:25px;
  letter-spacing:2px;
  margin-bottom:34px;
}

.avatar{
  width:92px;
  height:92px;
  border-radius:50%;
  background:#111;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 20px;
  font-size:28px;
  font-weight:800;
}

h1{
  font-size:27px;
  margin:0 0 6px;
}

.company{
  font-size:18px;
  font-weight:600;
  color:#666;
  margin-bottom:32px;
}

.info{
  width:100%;
  display:grid;
  gap:11px;
}

.item{
  display:flex;
  align-items:center;
  gap:13px;
  background:#f7f7f7;
  border-radius:20px;
  padding:17px;
  text-align:left;
}

.icon{
  width:54px;
  height:54px;
  border-radius:14px;
  background:#111;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  flex-shrink:0;
}

.text{
  font-size:16px;
  line-height:1.35;
  word-break:break-word;
}

.label{
  display:block;
  font-size:13px;
  color:#777;
  margin-bottom:3px;
  text-transform:uppercase;
}

.text a{
  color:#111;
  text-decoration:none;
}

.save{
  display:block;
  width:100%;
  text-align:center;
  background:#111;
  color:#fff;
  text-decoration:none;
  padding:18px;
  border-radius:18px;
  font-size:17px;
  font-weight:800;
  margin-top:20px;
}

.note{
  font-size:13px;
  color:#888;
  text-align:center;
  margin-top:14px;
  line-height:1.4;
}

.footer{
  margin-top:70px;
  font-size:13px;
  color:#aaa;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">TAP5</div>

  <div class="avatar">DQ</div>

  <h1>Dra. Denisse Quiñones</h1>

  <div class="company">Nishadent</div>

  <div class="info">

    <div class="item">
      <div class="icon">☎</div>
      <div class="text">
        <span class="label">Teléfono</span>
        <a href="tel:+51994827954">994 827 954</a>
      </div>
    </div>

    <div class="item">
      <div class="icon">✉</div>
      <div class="text">
        <span class="label">Correo</span>
        <a href="mailto:Dequiri@hotmail.com">Dequiri@hotmail.com</a>
      </div>
    </div>

    <div class="item">
      <div class="icon">⌖</div>
      <div class="text">
        <span class="label">Dirección</span>
        Av. Zaragoza MZ. F Lote 2, Lima, Perú, 15307
      </div>
    </div>

  </div>

  <a class="save" href="contact.vcf">
    GUARDAR CONTACTO
  </a>

  <div class="note">
    Al tocar el botón podrás agregar los datos de la Dra. Denisse a tus contactos.
  </div>

  <div class="footer">
    Tu identidad digital, en un toque.
  </div>

</div>

</body>
</html>
