<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ferretería ADEMIFE | Tap5</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#ffffff;
    color:#111;
}

/* =========================
   PORTADA
========================= */

.hero{
    width:100%;
    height:100svh;
    min-height:100svh;

    background-image:url("ademife-fondo-vertical.png");
    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;

    position:relative;
}

/* Indicador para deslizar */

.scroll-indicator{
    position:absolute;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);

    color:white;
    text-align:center;

    font-size:13px;
    font-weight:bold;

    text-shadow:0 2px 6px rgba(0,0,0,.8);

    animation:bounce 1.7s infinite;
}

.scroll-arrow{
    font-size:30px;
    line-height:25px;
    margin-top:4px;
}

@keyframes bounce{

    0%,20%,50%,80%,100%{
        transform:translate(-50%,0);
    }

    40%{
        transform:translate(-50%,-8px);
    }

    60%{
        transform:translate(-50%,-4px);
    }

}


/* =========================
   INFORMACIÓN
========================= */

.contact-section{

    background:
    linear-gradient(
        180deg,
        #ffffff 0%,
        #f4f8ff 100%
    );

    padding:45px 20px 55px;
}


/* Logo TAP5 */

.tap5-logo{

    width:110px;
    margin:0 auto 25px;
    display:block;

}


/* Avatar */

.avatar{

    width:92px;
    height:92px;

    margin:0 auto 15px;

    border-radius:50%;

    background:
    linear-gradient(
        135deg,
        #0057d9,
        #003a91
    );

    display:flex;
    align-items:center;
    justify-content:center;

    color:#ffffff;

    font-size:32px;
    font-weight:bold;

    box-shadow:
    0 8px 25px rgba(0,0,0,.18);

}


/* Nombre */

.name{

    text-align:center;

    font-size:27px;
    font-weight:800;

    margin-bottom:5px;

}


/* Empresa */

.company{

    text-align:center;

    color:#0057d9;

    font-size:17px;
    font-weight:700;

    margin-bottom:30px;

}


/* =========================
   DATOS
========================= */

.info{

    max-width:500px;
    margin:0 auto;

}


/* Tarjetas */

.info-card{

    background:white;

    border-radius:18px;

    padding:17px 18px;

    margin-bottom:13px;

    display:flex;

    align-items:center;

    gap:15px;

    text-decoration:none;

    color:#111;

    box-shadow:
    0 5px 18px rgba(0,0,0,.08);

    transition:.2s;

}


.info-card:active{

    transform:scale(.98);

}


/* Iconos */

.icon{

    width:48px;
    height:48px;

    border-radius:14px;

    background:#0057d9;

    color:#ffffff;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:22px;

    flex-shrink:0;

}


/* Texto */

.info-text{

    display:flex;
    flex-direction:column;

    gap:4px;

}

.info-title{

    font-size:12px;

    color:#777;

    font-weight:bold;

    text-transform:uppercase;

}

.info-value{

    font-size:16px;

    font-weight:600;

    line-height:1.35;

}


/* =========================
   BOTONES
========================= */

.button{

    display:block;

    width:100%;

    max-width:500px;

    margin:16px auto 0;

    padding:18px;

    border-radius:16px;

    text-align:center;

    text-decoration:none;

    font-size:16px;

    font-weight:800;

    transition:.2s;

}


.save-button{

    background:#0057d9;

    color:white;

    box-shadow:
    0 8px 20px rgba(0,87,217,.25);

}


.facebook-button{

    background:#1877f2;

    color:white;

}


.location-button{

    background:#ffffff;

    color:#0057d9;

    border:2px solid #0057d9;

}


.button:active{

    transform:scale(.98);

}


/* =========================
   FOOTER
========================= */

.footer{

    text-align:center;

    padding-top:35px;

    color:#777;

    font-size:12px;

}


.footer strong{

    color:#0057d9;

}

</style>

</head>


<body>


<!-- =========================
     PORTADA
========================= -->

<section class="hero">

    <div class="scroll-indicator">

        DESLIZA PARA VER LA INFORMACIÓN

        <div class="scroll-arrow">
            ↓
        </div>

</section>

    <!-- AVATAR -->

    <div class="avatar">
        AR
    </div>

    <h1 class="name">

    </h1>


    <!-- EMPRESA -->

    <div class="company">
        FERRETERIA ADEMIFE
    </div>


    <div class="info">


        <!-- TELÉFONO -->

        <a
            class="info-card"
            href="tel:+51947318360"
        >

            <div class="icon">
                📞
            </div>

            <div class="info-text">

                <div class="info-title">
                    Teléfono
                </div>

                <div class="info-value">
                    947 318 360
                </div>

            </div>

        </a>



        <!-- DIRECCIÓN -->

        <a
            class="info-card"

        >

            <div class="icon">

        <!-- GUARDAR CONTACTO -->

        <a

        <!-- FACEBOOK -->

        <a

        >

            f &nbsp; VISITAR FACEBOOK

        </a>



        <!-- UBICACIÓN -->

        <a
            class="button location-button"
            href="https://maps.app.goo.gl/ZVz6K133XEcT29Jd7"
            target="_blank"
            rel="noopener noreferrer"
        >

            📍 VER UBICACIÓN

        </a>


    </div>



    <!-- FOOTER -->

    <div class="footer">

        Tecnología que conecta con

        <strong>Tap5</strong>

    </div>


</section>


</body>
</html>
