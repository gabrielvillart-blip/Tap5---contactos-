<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Ferretería ADEMIFE | Tap5</title>

<style>

/* =========================
   CONFIGURACIÓN GENERAL
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#ffffff;
    color:#111111;
}


/* =========================
   PORTADA ADEMIFE
========================= */

.hero{

    width:100%;

    height:100svh;

    min-height:100svh;

    background-image:
        url("ademife-fondo-vertical.png");

    background-size:cover;

    background-position:center center;

    background-repeat:no-repeat;

}


/* =========================
   SECCIÓN DE INFORMACIÓN
========================= */

.contact-section{

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #f4f8ff 100%
        );

    padding:
        45px
        20px
        55px;

}


/* =========================
   LOGO TAP5
========================= */

.tap5-logo{

    text-align:center;

    font-size:30px;

    font-weight:800;

    letter-spacing:-1px;

    margin-bottom:28px;

    color:#111111;

}

.tap5-logo span{

    color:#0057d9;

}


/* =========================
   AVATAR
========================= */

.avatar{

    width:92px;

    height:92px;

    margin:
        0
        auto
        16px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #0057d9,
            #003a91
        );

    display:flex;

    align-items:center;

    justify-content:center;

    color:#ffffff;

    font-size:32px;

    font-weight:800;

    box-shadow:
        0
        8px
        25px
        rgba(0,0,0,.18);

}


/* =========================
   NOMBRE
========================= */

.name{

    text-align:center;

    font-size:27px;

    font-weight:800;

    margin-bottom:6px;

    color:#111111;

}


/* =========================
   EMPRESA
========================= */

.company{

    text-align:center;

    color:#0057d9;

    font-size:17px;

    font-weight:800;

    margin-bottom:30px;

}


/* =========================
   CONTENEDOR
========================= */

.info{

    width:100%;

    max-width:500px;

    margin:
        0
        auto;

}


/* =========================
   TARJETAS DE INFORMACIÓN
========================= */

.info-card{

    background:#ffffff;

    border-radius:18px;

    padding:
        17px
        18px;

    margin-bottom:14px;

    display:flex;

    align-items:center;

    gap:15px;

    text-decoration:none;

    color:#111111;

    box-shadow:
        0
        5px
        18px
        rgba(0,0,0,.08);

    transition:
        transform .2s ease;

}


.info-card:active{

    transform:scale(.98);

}


/* =========================
   ICONOS
========================= */

.icon{

    width:48px;

    height:48px;

    min-width:48px;

    border-radius:14px;

    background:#0057d9;

    color:#ffffff;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:22px;

}


/* =========================
   TEXTO DE INFORMACIÓN
========================= */

.info-text{

    display:flex;

    flex-direction:column;

    gap:4px;

}


.info-title{

    font-size:12px;

    color:#777777;

    font-weight:700;

    text-transform:uppercase;

}


.info-value{

    font-size:16px;

    font-weight:600;

    line-height:1.35;

}


/* =========================
   BOTONES
========================= */

.button{

    display:block;

    width:100%;

    padding:18px;

    margin:
        16px
        auto
        0;

    border-radius:16px;

    text-align:center;

    text-decoration:none;

    font-size:16px;

    font-weight:800;

    transition:
        transform .2s ease;

}


.button:active{

    transform:scale(.98);

}


/* =========================
   GUARDAR CONTACTO
========================= */

.save-button{

    background:#0057d9;

    color:#ffffff;

    box-shadow:
        0
        8px
        20px
        rgba(0,87,217,.25);

}


/* =========================
   FACEBOOK
========================= */

.facebook-button{

    background:#1877f2;

    color:#ffffff;

}


/* =========================
   UBICACIÓN
========================= */

.location-button{

    background:#ffffff;

    color:#0057d9;

    border:
        2px
        solid
        #0057d9;

}


/* =========================
   FOOTER
========================= */

.footer{

    text-align:center;

    padding-top:35px;

    color:#777777;

    font-size:12px;

}


.footer strong{

    color:#0057d9;

}

</style>

</head>


<body>


<!-- ==================================================
     PORTADA

<section class="hero"></section>

    <div class="info">

        =========================================== -->

        <a

        >

            <div class="icon">

            </div>


            <div class="info-text">

        <a

        <!-- ==========================================

        <a

        </a>



        <!-- ==========================================

        <a

        <!-- ==========================================

        =========================================== -->

        <a

        >

        </a>


    </div>



    <!-- ==========================================
         PIE DE PÁGINA
    =========================================== -->

    <div class="footer">

        Tecnología que conecta con

        <strong>Tap5</strong>

    </div>


</section>


</body>

</html>
